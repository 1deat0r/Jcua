name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m py_compile src/jcua/*.py
      - run: python3 scripts/check_no_secrets.py
      - run: pip install -e . && jcua eval --golden || true
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python3 scripts/check_readme.py
      - run: python3 scripts/sync_repo_meta.py --check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
