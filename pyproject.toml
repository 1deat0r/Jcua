[project]
name = "jcua"
version = "0.1.3"
description = "Jev Computer Use Agent — cross-platform self-improving computer-use (cua offshoot)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.scripts]
jcua = "jcua.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
